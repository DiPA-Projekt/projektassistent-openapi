SingleProduct:
  type: object
  properties:
    productName:
      description: Product name
      type: string
      example: "Projektauftrag"
    responsible:
      description: Product responsible
      type: string
      example: "Projektauftraggeber"
    projectName:
      description: Project name
      type: string
      example: "Mein Projekt"
    modelVariantId:
      description: ID of the selected model variant in the tailoring service
      type: string
    projectTypeId:
      description: ID of the selected project type in the tailoring service
      type: string
    projectTypeVariantId:
      description: ID of the selected project type variant in the tailoring service
      type: string
    participants:
      description: List of participants
      type: array
      items:
        type: string
    chapters:
      description: List of chapters
      type: array
      items:
        $ref: 'chapterEntry.yml#/ChapterEntry'
  required:
    - productName
    - responsible
    - projectName
    - chapters
